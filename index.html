<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OIDARCHE — Radio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #090807;
    }

    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: #ede8db;
      overflow-x: hidden;
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      min-height: 100vh;
      background: #090807;
    }

    .container {
      width: calc(100% - 128px);
      max-width: 1312px;
      margin: 0 auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      height: 124px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: 210px;
      height: 89px;
      object-fit: contain;
      display: block;
    }

    .header-divider {
      height: 1px;
      background: #2e2b26;
      width: 100%;
      position: absolute;
      left: 0;
      bottom: 0;
    }

    /* =========================
       HERO / GIF
    ========================= */

    .hero {
      position: relative;
      width: 100%;
      height: 540px;
      margin-top: 20px;
      background: #1c1b18;
      overflow: hidden;
      border-radius: 2px;
    }

    .hero-gif {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /*
      Figma'daki koyu overlay.
      GIF'in görüntüsü tamamen kaybolmasın diye
      sadece hafif karartıyoruz.
    */
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 5, 0.18);
      pointer-events: none;
    }

    /* =========================
       GIF TEXT
    ========================= */

    .gif-label {
      position: absolute;
      top: 24px;
      left: 24px;

      color: #ede8db;

      font-size: 13px;
      line-height: 30px;
      font-weight: 600;
      letter-spacing: 2px;

      z-index: 3;
    }

    .gif-description {
      position: absolute;
      top: 50px;
      left: 24px;

      color: #a69e91;

      font-size: 12px;
      line-height: 30px;
      font-weight: 400;

      z-index: 3;
    }

    /* =========================
       PLAY BUTTON
    ========================= */

    .play-button {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 140px;
      height: 140px;

      transform: translate(-50%, -50%);

      border: 2px solid #00bbff;
      border-left-color: transparent;

      border-radius: 50%;

      background: transparent;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 5;

      transition:
        transform 0.25s ease,
        border-color 0.25s ease;
    }

    .play-button:hover {
      transform: translate(-50%, -50%) scale(1.03);
    }

    .play-icon {
      width: 0;
      height: 0;

      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 22px solid #ffffff;

      margin-left: 7px;
    }

    .play-button.playing {
      border-left-color: #00bbff;
      animation: spin 3s linear infinite;
    }

    .play-button.playing .play-icon {
      width: 18px;
      height: 28px;
      border: none;
      margin-left: 0;

      position: relative;
    }

    .play-button.playing .play-icon::before,
    .play-button.playing .play-icon::after {
      content: "";
      position: absolute;
      top: 0;

      width: 5px;
      height: 28px;

      background: #ffffff;
    }

    .play-button.playing .play-icon::before {
      left: 0;
    }

    .play-button.playing .play-icon::after {
      right: 0;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       NOW PLAYING
    ========================= */

    .now-playing {
      padding-top: 22px;
      padding-bottom: 14px;
    }

    .now-label {
      color: #00bbff;

      font-size: 11px;
      line-height: 30px;
      font-weight: 600;

      letter-spacing: 2px;
    }

    .track {
      color: #ede8db;

      font-size: 25px;
      line-height: 32.5px;
      font-weight: 600;

      letter-spacing: 0.5px;

      min-height: 33px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      border-top: 1px solid #2e2b26;

      min-height: 110px;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      padding-top: 22px;
    }

    .genres {
      color: #a69e91;

      font-size: 11px;
      line-height: 30px;
      font-weight: 400;

      letter-spacing: 1.2px;
    }

    .tagline {
      color: #a69e91;

      font-size: 11px;
      line-height: 30px;
      font-weight: 400;

      letter-spacing: 0.8px;

      text-align: right;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .container {
        width: calc(100% - 32px);
      }

      .header {
        height: 100px;
      }

      .logo {
        width: 170px;
        height: 72px;
      }

      .hero {
        height: 56vw;
        min-height: 300px;
        max-height: 540px;
        margin-top: 16px;
      }

      .gif-label {
        top: 18px;
        left: 18px;
        font-size: 11px;
      }

      .gif-description {
        top: 43px;
        left: 18px;
        right: 18px;

        font-size: 10px;
        line-height: 16px;
      }

      .play-button {
        width: 100px;
        height: 100px;
      }

      .play-icon {
        border-top-width: 11px;
        border-bottom-width: 11px;
        border-left-width: 18px;
      }

      .now-playing {
        padding-top: 18px;
      }

      .track {
        font-size: 20px;
      }

      .footer {
        flex-direction: column;
        gap: 8px;
        padding-bottom: 20px;
      }

      .tagline {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header container">

      <img
        class="logo"
        src="Vector%20mavi.png"
        alt="Oidarche"
      >

      <div class="header-divider"></div>

    </header>


    <!-- =========================
         HERO
    ========================== -->

    <section class="hero container">

      <img
        class="hero-gif"
        src="gif%20sunset.gif"
        alt=""
      >

      <div class="hero-overlay"></div>


      <div class="gif-label">
        INSERT / REPLACE GIF
      </div>

      <div class="gif-description">
        The central motion image can be replaced later without changing the layout.
      </div>


      <!-- PLAY -->

      <button
        id="playButton"
        class="play-button"
        aria-label="Play radio"
        type="button"
      >
        <span class="play-icon"></span>
      </button>

    </section>


    <!-- =========================
         NOW PLAYING
    ========================== -->

    <section class="now-playing container">

      <div class="now-label">
        NOW PLAYING
      </div>

      <div
        id="track"
        class="track"
      >
        Artist — Track Title
      </div>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer container">

      <div class="genres">
        SOUL&nbsp;&nbsp; / &nbsp;&nbsp;BLUES&nbsp;&nbsp; / &nbsp;&nbsp;REGGAE&nbsp;&nbsp; / &nbsp;&nbsp;CLASSICS
      </div>

      <div class="tagline">
        music without borders
      </div>

    </footer>

  </main>


  <!-- =========================
       AUDIO
  ========================== -->

  <audio
    id="radio"
    preload="none"
  ></audio>


  <script>

    /* ==========================================
       OIDARCHE RADIO CONFIG
    ========================================== */

    const STREAM_URL =
      "http://172.23.169.201:8000/radio.mp3";

    const API_URL =
      "http://172.23.169.201/api/nowplaying/oidarche";


    /* ==========================================
       ELEMENTS
    ========================================== */

    const radio =
      document.getElementById("radio");

    const playButton =
      document.getElementById("playButton");

    const track =
      document.getElementById("track");


    /* ==========================================
       AUDIO SOURCE
    ========================================== */

    radio.src = STREAM_URL;


    /* ==========================================
       PLAY / PAUSE
    ========================================== */

    playButton.addEventListener("click", async () => {

      try {

        if (radio.paused) {

          await radio.play();

          playButton.classList.add("playing");

        } else {

          radio.pause();

          playButton.classList.remove("playing");

        }

      } catch (error) {

        console.error(
          "Radio could not be started:",
          error
        );

      }

    });


    /* ==========================================
       AUDIO EVENTS
    ========================================== */

    radio.addEventListener("play", () => {

      playButton.classList.add("playing");

    });


    radio.addEventListener("pause", () => {

      playButton.classList.remove("playing");

    });


    /* ==========================================
       NOW PLAYING
    ========================================== */

    async function updateNowPlaying() {

      try {

        const response =
          await fetch(
            API_URL,
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            "API response: " +
            response.status
          );
        }

        const data =
          await response.json();


        if (
          data &&
          data.now_playing &&
          data.now_playing.song
        ) {

          const artist =
            data.now_playing.song.artist || "";

          const title =
            data.now_playing.song.title || "";


          if (artist && title) {

            track.textContent =
              artist + " — " + title;

          } else if (title) {

            track.textContent =
              title;

          } else {

            track.textContent =
              "Artist — Track Title";

          }

        }

      } catch (error) {

        console.log(
          "Now Playing could not be updated:",
          error
        );

      }

    }


    /* ==========================================
       INITIAL UPDATE
    ========================================== */

    updateNowPlaying();


    /* ==========================================
       UPDATE EVERY 10 SECONDS
    ========================================== */

    setInterval(
      updateNowPlaying,
      10000
    );

  </script>

</body>
</html>
