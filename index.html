<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OIDARCHE — Radio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #061a22;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow: hidden;
    }

    /* GIF ARKA PLAN */
    .background-gif {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.42;
      z-index: 0;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 20, 27, 0.58);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    /* LOGO */
    .logo {
      width: 190px;
      max-width: 65vw;
      height: auto;
      margin-bottom: 22px;
    }

    .on-air {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 28px;
      opacity: 0.9;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 14px rgba(255,255,255,0.8);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.35;
        transform: scale(0.7);
      }
    }

    /* PLAY */
    .play-button {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 38px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
      margin-bottom: 34px;
    }

    .play-button:hover {
      transform: scale(1.06);
      background: rgba(255,255,255,0.16);
    }

    .play-button:active {
      transform: scale(0.96);
    }

    /* NOW PLAYING */
    .now-playing-label {
      font-size: 11px;
      letter-spacing: 4px;
      opacity: 0.65;
      margin-bottom: 12px;
    }

    .song-title {
      font-size: clamp(26px, 5vw, 48px);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .artist {
      font-size: clamp(15px, 2vw, 20px);
      opacity: 0.72;
      margin-bottom: 30px;
    }

    .status {
      min-height: 20px;
      font-size: 12px;
      opacity: 0.55;
    }

    /* GEÇMİŞ */
    .history {
      margin: 35px auto 0;
      max-width: 600px;
      text-align: left;
      padding: 22px;
      border-top: 1px solid rgba(255,255,255,0.15);
    }

    .history-title {
      font-size: 10px;
      letter-spacing: 3px;
      opacity: 0.55;
      margin-bottom: 14px;
      text-align: center;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
    }

    .history-artist {
      opacity: 0.6;
      text-align: right;
    }

    @media (max-width: 600px) {
      .logo {
        width: 150px;
      }

      .play-button {
        width: 90px;
        height: 90px;
        font-size: 32px;
      }

      .history {
        padding: 15px;
      }

      .history-item {
        flex-direction: column;
        gap: 3px;
      }

      .history-artist {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- GIF -->
    <img
      class="background-gif"
      src="gif sunset.gif"
      alt=""
    >

    <div class="overlay"></div>

    <main class="content">

      <!-- LOGO -->
      <img
        class="logo"
        src="Vector mavi.png"
        alt="OIDARCHE"
      >

      <!-- ON AIR -->
      <div class="on-air">
        <span class="dot"></span>
        <span>ON AIR</span>
      </div>

      <!-- PLAY BUTTON -->
      <button
        class="play-button"
        id="playButton"
        aria-label="Radyoyu oynat"
      >
        ▶
      </button>

      <!-- NOW PLAYING -->
      <div class="now-playing-label">
        NOW PLAYING
      </div>

      <div
        class="song-title"
        id="songTitle"
      >
        Oidarche Radio
      </div>

      <div
        class="artist"
        id="artistName"
      >
        Night Soul
      </div>

      <div
        class="status"
        id="status"
      >
        Hazırlanıyor...
      </div>

      <!-- SONG HISTORY -->
      <section class="history">

        <div class="history-title">
          RECENTLY PLAYED
        </div>

        <div id="historyList">
          <div class="history-item">
            <span>Yükleniyor...</span>
          </div>
        </div>

      </section>

    </main>

  </div>

  <!-- RADYO SESİ -->
  <audio
    id="radio"
    preload="none"
  ></audio>


  <script>

    /*
      OIDARCHE RADIO
      AzuraCast bağlantısı
    */

    const radio = document.getElementById("radio");
    const playButton = document.getElementById("playButton");

    const songTitle = document.getElementById("songTitle");
    const artistName = document.getElementById("artistName");
    const status = document.getElementById("status");
    const historyList = document.getElementById("historyList");

    /*
      AZURACAST YAYINI
    */

    const STREAM_URL =
      "http://172.23.169.201:8000/radio.mp3";

    /*
      AZURACAST NOW PLAYING API
    */

    const API_URL =
      "http://172.23.169.201/api/nowplaying/oidarche";


    /*
      PLAY / PAUSE
    */

    playButton.addEventListener("click", async () => {

      if (radio.paused) {

        radio.src = STREAM_URL;

        try {

          await radio.play();

          playButton.textContent = "❚❚";
          status.textContent = "Oidarche Radio çalıyor";

        } catch (error) {

          console.error(error);

          status.textContent =
            "Yayın başlatılamadı.";

        }

      } else {

        radio.pause();

        playButton.textContent = "▶";

        status.textContent =
          "Yayın duraklatıldı.";

      }

    });


    /*
      NOW PLAYING BİLGİSİNİ AL
    */

    async function updateNowPlaying() {

      try {

        const response =
          await fetch(
            API_URL + "?_=" + Date.now()
          );

        if (!response.ok) {
          throw new Error("API bağlantısı başarısız");
        }

        const data =
          await response.json();

        if (
          data.now_playing &&
          data.now_playing.song
        ) {

          const song =
            data.now_playing.song;

          songTitle.textContent =
            song.title || "Bilinmeyen parça";

          artistName.textContent =
            song.artist || "Bilinmeyen sanatçı";

          status.textContent =
            "Oidarche Radio";

        }

        /*
          ŞARKI GEÇMİŞİ
        */

        if (
          data.song_history &&
          data.song_history.length
        ) {

          historyList.innerHTML = "";

          data.song_history
            .slice(0, 5)
            .forEach(item => {

              if (
                !item.song
              ) {
                return;
              }

              const row =
                document.createElement("div");

              row.className =
                "history-item";

              const title =
                document.createElement("span");

              title.textContent =
                item.song.title || "";

              const artist =
                document.createElement("span");

              artist.className =
                "history-artist";

              artist.textContent =
                item.song.artist || "";

              row.appendChild(title);
              row.appendChild(artist);

              historyList.appendChild(row);

            });

        }

      } catch (error) {

        console.error(
          "Now Playing hatası:",
          error
        );

        status.textContent =
          "Şarkı bilgisi bekleniyor...";

      }

    }


    /*
      SAYFA AÇILDIĞINDA ÇEK
    */

    updateNowPlaying();


    /*
      HER 5 SANİYEDE BİR KONTROL ET
    */

    setInterval(
      updateNowPlaying,
      5000
    );

  </script>

</body>
</html>
