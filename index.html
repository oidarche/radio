<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OIDARCHE — Radio</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #090807;
      color: #ede8db;
      font-family: Inter, Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* =========================
       MAIN PAGE
    ========================= */

    .page {
      width: 100%;
      min-height: 100vh;
      background: #090807;
      padding: 0 4.45vw 30px;
    }

    .container {
      width: 100%;
      max-width: 1312px;
      margin: 0 auto;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 124px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .logo {
      position: absolute;
      width: 210px;
      height: 89px;
      top: 21px;
      left: 50%;
      transform: translateX(-50%);
      object-fit: contain;
    }

    .header-divider {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1px;
      background: #2e2b26;
    }

    /* =========================
       HERO / GIF AREA
    ========================= */

    .hero {
      position: relative;
      width: 100%;
      height: 540px;
      margin-top: 20px;
      background: #1c1b18;
      overflow: hidden;
      border-radius: 2px;
    }

    .background-gif {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /*
      Figma'daki koyu overlay.
      GIF yoksa da arka plan Figma'daki gibi
      koyu kalır.
    */
    .gif-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 5, 0.18);
      z-index: 2;
    }

    /* =========================
       FIGMA TEXT
    ========================= */

    .insert-title {
      position: absolute;
      z-index: 3;
      top: 24px;
      left: 24px;

      color: #ede8db;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      line-height: 30px;
    }

    .insert-description {
      position: absolute;
      z-index: 3;
      top: 50px;
      left: 24px;

      color: #a69e91;
      font-size: 12px;
      font-weight: 400;
      line-height: 30px;
    }

    /* =========================
       PLAY CONTROL
    ========================= */

    .play-control {
      position: absolute;
      z-index: 5;

      width: 140px;
      height: 140px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border: none;
      background: transparent;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
    }

    /*
      Figma'daki mavi dairesel play kontrolü
    */

    .play-ring {
      position: absolute;
      width: 140px;
      height: 140px;

      border-radius: 50%;

      border: 3px solid #00b7ff;

      border-left-color: transparent;
      border-bottom-color: transparent;

      transform: rotate(45deg);

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .play-control:hover .play-ring {
      transform: rotate(45deg) scale(1.04);
    }

    .play-icon {
      position: relative;
      z-index: 2;

      width: 0;
      height: 0;

      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 22px solid #ffffff;

      margin-left: 7px;

      transition: all 0.2s ease;
    }

    /* Çalarken STOP */

    .play-control.playing .play-ring {
      animation: rotateRing 3s linear infinite;
    }

    @keyframes rotateRing {
      from {
        transform: rotate(45deg);
      }

      to {
        transform: rotate(405deg);
      }
    }

    .play-control.playing .play-icon {
      width: 18px;
      height: 25px;

      border: none;

      margin-left: 0;

      background:
        linear-gradient(
          to right,
          #ffffff 0,
          #ffffff 6px,
          transparent 6px,
          transparent 12px,
          #ffffff 12px,
          #ffffff 18px
        );
    }

    /* =========================
       NOW PLAYING
    ========================= */

    .now-playing {
      margin-top: 21px;
    }

    .now-playing-label {
      color: #00b7ff;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 2px;

      line-height: 30px;
    }

    .song-title {
      color: #ede8db;

      font-size: 25px;
      font-weight: 600;

      letter-spacing: 0.5px;

      line-height: 32px;

      min-height: 32px;

      max-width: 800px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      position: relative;

      margin-top: 13px;

      padding-top: 21px;

      border-top: 1px solid #2e2b26;

      min-height: 80px;
    }

    .genres {
      color: #a69e91;

      font-size: 11px;
      font-weight: 400;

      letter-spacing: 1.2px;

      line-height: 30px;
    }

    .motto {
      position: absolute;
      right: 0;
      top: 21px;

      color: #a69e91;

      font-size: 11px;
      font-weight: 400;

      letter-spacing: 0.8px;

      line-height: 30px;

      text-align: right;
    }

    /* =========================
       HIDDEN AUDIO
    ========================= */

    audio {
      display: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .page {
        padding: 0 20px 25px;
      }

      header {
        height: 105px;
      }

      .logo {
        width: 170px;
        height: 72px;
        top: 15px;
      }

      .hero {
        height: 58vw;
        min-height: 320px;
        max-height: 540px;
        margin-top: 15px;
      }

      .insert-title {
        top: 18px;
        left: 18px;
        font-size: 11px;
      }

      .insert-description {
        top: 42px;
        left: 18px;
        right: 18px;
        font-size: 10px;
      }

      .play-control {
        width: 110px;
        height: 110px;
      }

      .play-ring {
        width: 110px;
        height: 110px;
      }

      .song-title {
        font-size: 21px;
      }

      .motto {
        position: static;
        text-align: left;
        margin-top: 5px;
      }
    }

    @media (max-width: 480px) {

      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      header {
        height: 92px;
      }

      .logo {
        width: 145px;
        height: 62px;
        top: 12px;
      }

      .hero {
        height: 70vh;
        min-height: 330px;
        max-height: 500px;
      }

      .insert-title {
        font-size: 10px;
        letter-spacing: 1.5px;
      }

      .insert-description {
        font-size: 9px;
        line-height: 18px;
        max-width: 260px;
      }

      .play-control {
        width: 100px;
        height: 100px;
      }

      .play-ring {
        width: 100px;
        height: 100px;
      }

      .now-playing {
        margin-top: 16px;
      }

      .song-title {
        font-size: 19px;
      }

      .genres {
        font-size: 9px;
        letter-spacing: 0.8px;
      }

      .motto {
        font-size: 9px;
      }
    }

  </style>
</head>

<body>

  <div class="page">

    <div class="container">

      <!-- =========================
           HEADER
      ========================== -->

      <header>

        <img
          class="logo"
          src="Vector mavi.png"
          alt="oidARche"
        >

        <div class="header-divider"></div>

      </header>


      <!-- =========================
           HERO
      ========================== -->

      <section class="hero">

        <!-- Senin mevcut GIF'in -->
        <img
          class="background-gif"
          src="gif sunset.gif"
          alt=""
        >

        <div class="gif-overlay"></div>


        <!-- Figma'daki yazılar -->

        <div class="insert-title">
          INSERT / REPLACE GIF
        </div>

        <div class="insert-description">
          The central motion image can be replaced later without changing the layout.
        </div>


        <!-- PLAY -->

        <button
          class="play-control"
          id="playButton"
          aria-label="Play radio"
        >

          <span class="play-ring"></span>

          <span class="play-icon"></span>

        </button>

      </section>


      <!-- =========================
           NOW PLAYING
      ========================== -->

      <section class="now-playing">

        <div class="now-playing-label">
          NOW PLAYING
        </div>

        <div
          class="song-title"
          id="songTitle"
        >
          Artist — Track Title
        </div>

      </section>


      <!-- =========================
           FOOTER
      ========================== -->

      <footer class="footer">

        <div class="genres">
          SOUL&nbsp;&nbsp; / &nbsp;&nbsp;BLUES&nbsp;&nbsp; / &nbsp;&nbsp;REGGAE&nbsp;&nbsp; / &nbsp;&nbsp;CLASSICS
        </div>

        <div class="motto">
          music without borders
        </div>

      </footer>

    </div>

  </div>


  <!-- =========================
       RADIO
  ========================== -->

  <audio
    id="radio"
    preload="none"
  ></audio>


  <script>

    const radio = document.getElementById("radio");
    const playButton = document.getElementById("playButton");

    const songTitle = document.getElementById("songTitle");


    /*
      SENİN ÇALIŞAN RADYO ADRESİN
    */

 const STREAM_URL =
  "https://172.23.169.201:8000/radio.mp3";

const API_URL =
  "https://172.23.169.201/api/nowplaying/oidarche";


    /*
      AZURACAST NOW PLAYING API
    */

    const API_URL =
      "http://172.23.169.201/api/nowplaying/oidarche";


    /* =========================
       PLAY / STOP
    ========================== */

    playButton.addEventListener("click", async () => {

      /*
        RADYO ÇALIYORSA DURDUR
      */

      if (!radio.paused) {

        radio.pause();

        playButton.classList.remove("playing");

        return;
      }


      /*
        RADYO DURUYORSA BAŞLAT
      */

      radio.src = STREAM_URL;

      try {

        await radio.play();

        playButton.classList.add("playing");

      } catch (error) {

        console.error(
          "Radio playback error:",
          error
        );

      }

    });


    /* =========================
       NOW PLAYING
    ========================== */

    async function updateNowPlaying() {

      try {

        const response =
          await fetch(
            API_URL + "?_=" + Date.now()
          );


        if (!response.ok) {
          throw new Error(
            "Now Playing API error"
          );
        }


        const data =
          await response.json();


        if (
          data.now_playing &&
          data.now_playing.song
        ) {

          const song =
            data.now_playing.song;


          const artist =
            song.artist || "";


          const title =
            song.title || "";


          /*
            Figma'daki:

            Artist — Track Title

            yapısını koruyoruz.
          */

          if (artist && title) {

            songTitle.textContent =
              artist + " — " + title;

          } else if (title) {

            songTitle.textContent =
              title;

          } else {

            songTitle.textContent =
              "Artist — Track Title";

          }

        }

      } catch (error) {

        console.error(
          "Now Playing hatası:",
          error
        );

      }

    }


    /*
      Sayfa açılır açılmaz şarkıyı al
    */

    updateNowPlaying();


    /*
      Her 5 saniyede bir güncelle
    */

    setInterval(
      updateNowPlaying,
      5000
    );


    /*
      Yayın doğal olarak durursa
      butonu tekrar PLAY yap
    */

    radio.addEventListener(
      "pause",
      () => {

        if (radio.currentTime > 0) {

          playButton.classList.remove(
            "playing"
          );

        }

      }
    );

  </script>

</body>
</html>
