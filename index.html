<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OIDARCHE — Radio</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #090807;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #ede8db;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      background: #090807;
      padding: 0 4.45vw 35px;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      height: 124px;
      position: relative;
      border-bottom: 1px solid #2e2b26;
    }

    .logo {
      position: absolute;
      left: 0;
      top: 32px;
      width: 190px;
      height: auto;
      display: block;
    }

    .on-air {
      position: absolute;
      right: 0;
      bottom: 27px;

      color: #00bbff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;

      white-space: nowrap;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;

      width: 100%;
      height: min(540px, 37.5vw);
      min-height: 320px;

      margin-top: 20px;

      overflow: hidden;

      border-radius: 2px;

      background:
        radial-gradient(
          circle at center,
          #173845 0%,
          #111b20 32%,
          #0b0d0e 70%,
          #070707 100%
        );
    }


    /*
      Buraya ileride OIDARCHE GIF'i gelecek.
    */

    .hero-gif {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: none;
    }


    .hero-overlay {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(0, 187, 255, 0.10),
          transparent 45%
        );
    }


    /* =========================
       HERO TEXT
    ========================= */

    .gif-label {
      position: absolute;

      top: 24px;
      left: 24px;

      z-index: 2;

      color: #ede8db;

      font-size: 13px;
      font-weight: 600;

      letter-spacing: 2px;
    }

    .gif-description {
      position: absolute;

      top: 50px;
      left: 24px;

      z-index: 2;

      color: #8e8980;

      font-size: 12px;
    }


    /* =========================
       PLAY BUTTON
    ========================= */

    .play-button {

      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 140px;
      height: 140px;

      border: none;

      background: transparent;

      cursor: pointer;

      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .play-ring {

      position: absolute;

      width: 140px;
      height: 140px;

      border-radius: 50%;

      border: 3px solid rgba(0, 187, 255, 0.18);

      border-right-color: #00bbff;

      transform: rotate(-45deg);

      transition: all 0.35s ease;
    }


    .play-triangle {

      width: 0;
      height: 0;

      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;

      border-left: 24px solid white;

      margin-left: 8px;

      transition: transform 0.35s ease;
    }


    .play-button:hover .play-ring {

      transform:
        rotate(-45deg)
        scale(1.07);
    }


    .play-button:hover .play-triangle {

      transform: scale(1.08);
    }


    .play-button.playing .play-ring {

      animation: pulse 2s infinite ease-in-out;
    }


    .play-button.playing .play-triangle {

      width: 20px;
      height: 26px;

      border: none;

      border-left: 5px solid white;
      border-right: 5px solid white;

      margin-left: 0;
    }


    @keyframes pulse {

      0%,
      100% {

        opacity: 0.7;

        transform:
          rotate(-45deg)
          scale(1);
      }

      50% {

        opacity: 1;

        transform:
          rotate(-45deg)
          scale(1.06);
      }
    }


    /* =========================
       NOW PLAYING
    ========================= */

    .now-playing {

      position: relative;

      padding-top: 25px;
      padding-bottom: 18px;

      border-bottom: 1px solid #2e2b26;
    }


    .now-label {

      color: #00bbff;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 2px;

      margin-bottom: 8px;
    }


    .track {

      color: #ede8db;

      font-size: 25px;
      font-weight: 600;

      letter-spacing: 0.5px;
    }


    .station {

      position: absolute;

      right: 0;
      bottom: 17px;

      color: #8e8980;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 1.5px;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {

      display: flex;

      justify-content: space-between;
      align-items: center;

      padding-top: 20px;
    }


    .genres,
    .tagline {

      color: #8e8980;

      font-size: 11px;
      font-weight: 400;
    }


    .genres {

      letter-spacing: 1.2px;
    }


    .tagline {

      letter-spacing: 0.8px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .page {

        padding:
          0
          20px
          25px;
      }


      .header {

        height: 90px;
      }


      .logo {

        top: 25px;

        width: 140px;
      }


      .on-air {

        bottom: 18px;

        font-size: 10px;
      }


      .hero {

        margin-top: 14px;

        height: 62vw;

        min-height: 280px;
      }


      .gif-label {

        font-size: 10px;

        top: 18px;
        left: 18px;
      }


      .gif-description {

        font-size: 9px;

        top: 38px;
        left: 18px;
      }


      .play-button,
      .play-ring {

        width: 100px;
        height: 100px;
      }


      .play-triangle {

        border-top-width: 12px;
        border-bottom-width: 12px;
        border-left-width: 18px;
      }


      .now-playing {

        padding-top: 20px;
      }


      .track {

        font-size: 19px;
      }


      .station {

        position: static;

        margin-top: 12px;

        font-size: 9px;
      }


      .footer {

        flex-direction: column;

        align-items: flex-start;

        gap: 14px;
      }


      .genres,
      .tagline {

        font-size: 9px;
      }

    }

  </style>

</head>


<body>


  <div class="page">


    <!-- HEADER -->

    <header class="header">

      <!-- OIDARCHE LOGO -->

      <img
        class="logo"
        src="https://www.figma.com/api/mcp/asset/12cf2dfe-2bcc-4b7e-8f75-c3dcf88c9dbb.svg"
        alt="OIDARCHE"
      >


      <div class="on-air">

        ●&nbsp;&nbsp;ON AIR

      </div>

    </header>



    <!-- MAIN -->

    <main>


      <!-- HERO -->

      <section class="hero">


        <img
          class="hero-gif"
          id="heroGif"
          src=""
          alt="Oidarche visual"
        >


        <div class="hero-overlay"></div>


        <div class="gif-label">

          OIDARCHE RADIO

        </div>


        <div class="gif-description">

          music without borders

        </div>



        <!-- PLAY -->

        <button
          class="play-button"
          id="playButton"
          aria-label="Play Oidarche Radio"
        >

          <span class="play-ring"></span>

          <span class="play-triangle"></span>

        </button>


      </section>



      <!-- NOW PLAYING -->

      <section class="now-playing">


        <div class="now-label">

          NOW PLAYING

        </div>


        <div
          class="track"
          id="track"
        >

          OIDARCHE RADIO

        </div>


        <div class="station">

          NIGHT SOUL
          &nbsp;/&nbsp;
          RADIO

        </div>


      </section>



      <!-- FOOTER -->

      <footer class="footer">


        <div class="genres">

          SOUL
          &nbsp;&nbsp;/
          &nbsp;&nbsp;
          BLUES
          &nbsp;&nbsp;/
          &nbsp;&nbsp;
          REGGAE
          &nbsp;&nbsp;/
          &nbsp;&nbsp;
          CLASSICS

        </div>


        <div class="tagline">

          music without borders

        </div>


      </footer>


    </main>


  </div>



  <!-- RADIO -->

  <audio
    id="radio"
    preload="none"
  ></audio>



  <script>


    const radio =
      document.getElementById("radio");


    const button =
      document.getElementById("playButton");


    /*
      GERÇEK RADYO YAYINI

      Yayın adresimizi bulduğumuzda
      buraya ekleyeceğiz.

      Örnek:

      radio.src = "https://.....";

    */


    button.addEventListener(
      "click",
      function () {


        if (!radio.src) {

          alert(
            "OIDARCHE yayını hazırlanıyor 🎧"
          );

          return;

        }


        if (radio.paused) {


          radio.play();


          button.classList.add(
            "playing"
          );


        } else {


          radio.pause();


          button.classList.remove(
            "playing"
          );

        }

      }
    );


  </script>


</body>
</html>
