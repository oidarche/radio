<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #1e1e1e;
    color: #f4f1ea;
    font-family: 'Montserrat', Arial, sans-serif;

/* =========================
   PAGE
========================= */

.page {
    min-height: 100vh;
    position: relative;
    padding: 34px 48px 30px;
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 10;
}

.logo {
    width: 145px;
    height: auto;
    object-fit: contain;
}

nav {
    display: flex;
    gap: 42px;
    align-items: center;
}

nav a {
    color: #f4f1ea;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 2.8px;
    font-weight: 500;
    opacity: .78;
    transition: opacity .3s ease;
}

nav a:hover {
    opacity: 1;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    min-height: calc(100vh - 120px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
}

/* =========================
   VISUALIZER
========================= */

.visualizer {
    width: min(700px, 85vw);
    height: min(390px, 48vw);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* horizontal waveform */

.wave {
    position: absolute;
    width: 100%;
    height: 110px;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    opacity: .7;
}

.wave::before,
.wave::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: #a8a29a;
    opacity: .35;
}

.wave::before {
    top: 31px;
}

.wave::after {
    bottom: 31px;
}

.wave-line {
    position: absolute;
    width: 100%;
    height: 100%;
    left: 0;
    top: 0;
}

.wave-line span {
    position: absolute;
    display: block;
    width: 1px;
    background: #a8a29a;
    opacity: .55;
    transform-origin: center;
}

/* =========================
   RIPPLE CIRCLES
========================= */

.rings {
    width: 285px;
    height: 285px;
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.ring {
    position: absolute;
    border: 1px solid rgba(244,241,234,.36);
    border-radius: 50%;
}

.ring:nth-child(1) {
    width: 280px;
    height: 280px;
}

.ring:nth-child(2) {
    width: 240px;
    height: 240px;
    opacity: .8;
}

.ring:nth-child(3) {
    width: 200px;
    height: 200px;
    opacity: .65;
}

.ring:nth-child(4) {
    width: 160px;
    height: 160px;
    opacity: .5;
}

.ring:nth-child(5) {
    width: 120px;
    height: 120px;
    opacity: .35;
}

/* center mark */

.center-mark {
    position: absolute;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.center-mark::before {
    content: "";
    position: absolute;
    width: 70px;
    height: 70px;
    border: 1px solid #f4f1ea;
    border-radius: 50%;
    opacity: .9;
}

.center-mark span {
    position: relative;
    z-index: 2;
    font-size: 27px;
    font-weight: 500;
    letter-spacing: -3px;
}

/* =========================
   PLAY BUTTON
========================= */

.play-button {
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: 1px solid rgba(244,241,234,.75);
    background: #1e1e1e;
    color: #f4f1ea;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    transition: all .3s ease;
    z-index: 5;
}

.play-button:hover {
    transform: translateX(-50%) scale(1.08);
    background: #292929;
}

.play-button.playing {
    border-color: #5d7df7;
    color: #5d7df7;
}

/* =========================
   NOW PLAYING
========================= */

.now-playing {
    margin-top: 48px;
    text-align: center;
}

.now-label {
    font-size: 9px;
    letter-spacing: 4px;
    color: #a8a29a;
    margin-bottom: 16px;
}

.track {
    font-size: clamp(20px, 3vw, 32px);
    font-weight: 400;
    letter-spacing: -.5px;
    color: #f4f1ea;
}

.live {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-size: 9px;
    letter-spacing: 3px;
    color: #a8a29a;
}

.live-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #a3c48f;
    box-shadow: 0 0 8px rgba(163,196,143,.8);
}

/* =========================
   PLAYER CONTROLS
========================= */

.controls {
    width: min(650px, 80vw);
    margin: 55px auto 0;
    display: flex;
    align-items: center;
    gap: 18px;
}

.volume-icon {
    width: 16px;
    opacity: .7;
    font-size: 14px;
}

.volume {
    flex: 1;
    height: 2px;
    background: rgba(244,241,234,.25);
    position: relative;
}

.volume-progress {
    width: 35%;
    height: 2px;
    background: #f4f1ea;
}

.volume-knob {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #5d7df7;
    top: -3px;
    left: 35%;
}

.menu {
    font-size: 18px;
    opacity: .7;
    letter-spacing: 2px;
}

/* =========================
   STATUS
========================= */

.status {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    letter-spacing: 2px;
    color: #a8a29a;
    opacity: .6;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .page {
        padding: 24px 20px;
    }

    header {
        align-items: flex-start;
    }

    .logo {
        width: 110px;
    }

    nav {
        gap: 14px;
        flex-wrap: wrap;
        justify-content: flex-end;
        max-width: 220px;
    }

    nav a {
        font-size: 8px;
        letter-spacing: 1.8px;
    }

    .visualizer {
        width: 100vw;
        height: 300px;
    }

    .rings {
        width: 220px;
        height: 220px;
    }

    .ring:nth-child(1) {
        width: 220px;
        height: 220px;
    }

    .ring:nth-child(2) {
        width: 185px;
        height: 185px;
    }

    .ring:nth-child(3) {
        width: 150px;
        height: 150px;
    }

    .ring:nth-child(4) {
        width: 115px;
        height: 115px;
    }

    .ring:nth-child(5) {
        width: 80px;
        height: 80px;
    }

    .center-mark::before {
        width: 58px;
        height: 58px;
    }

    .center-mark span {
        font-size: 21px;
    }

    .play-button {
        width: 64px;
        height: 64px;
    }

    .now-playing {
        margin-top: 32px;
    }

    .track {
        font-size: 21px;
        padding: 0 15px;
    }

    .controls {
        width: 90%;
        margin-top: 42px;
    }

}

/* =========================
   PLAYING ANIMATION
========================= */

.playing .ring {
    animation: breathe 2.8s ease-in-out infinite;
}

.playing .ring:nth-child(2) {
    animation-delay: .2s;
}

.playing .ring:nth-child(3) {
    animation-delay: .4s;
}

.playing .ring:nth-child(4) {
    animation-delay: .6s;
}

.playing .ring:nth-child(5) {
    animation-delay: .8s;
}

@keyframes breathe {

    0%,100% {
        transform: scale(1);
        opacity: .35;
    }

    50% {
        transform: scale(1.045);
        opacity: .75;
    }

}

<script>

/* ==========================================
   OIDARCHE RADIO
========================================== */

const radio =
    document.getElementById("radio");

const playButton =
    document.getElementById("playButton");

const track =
    document.getElementById("track");

const status =
    document.getElementById("status");

const visualizer =
    document.getElementById("visualizer");


/* ==========================================
   YAYIN ADRESİ
========================================== */

const STREAM_URL =
    "http://172.23.169.201:8000/radio.mp3";


/* ==========================================
   AZURACAST API
========================================== */

const API_URL =
    "http://172.23.169.201/api/nowplaying/oidarche";


/* ==========================================
   PLAY / STOP
========================================== */

playButton.addEventListener(
    "click",
    async () => {

        if (radio.paused) {

            try {

                radio.src = STREAM_URL;

                await radio.play();

                playButton.textContent = "■";

                playButton.classList.add(
                    "playing"
                );

                visualizer.classList.add(
                    "playing"
                );

                status.textContent =
                    "PLAYING";

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "YAYIN BAŞLATILAMADI";

            }

        }

        else {

            radio.pause();

            radio.removeAttribute("src");

            radio.load();

            playButton.textContent = "▶";

            playButton.classList.remove(
                "playing"
            );

            visualizer.classList.remove(
                "playing"
            );

            status.textContent =
                "OIDARCHE RADIO";

        }

    }
);


/* ==========================================
   NOW PLAYING
========================================== */

async function updateNowPlaying() {

    try {

        const response =
            await fetch(
                API_URL +
                "?_=" +
                Date.now()
            );

        if (!response.ok) {
            throw new Error(
                "API bağlantısı başarısız"
            );
        }

        const data =
            await response.json();


        if (
            data.now_playing &&
            data.now_playing.song
        ) {

            const song =
                data.now_playing.song;


            const artist =
                song.artist || "";


            const title =
                song.title ||
                "Bilinmeyen parça";


            if (artist) {

                track.textContent =
                    artist +
                    " — " +
                    title;

            }

            else {

                track.textContent =
                    title;

            }

        }

    }

    catch (error) {

        console.log(
            "Now Playing:",
            error
        );

    }

}


/* ==========================================
   İLK YÜKLEME
========================================== */

updateNowPlaying();


/* ==========================================
   5 SANİYEDE BİR GÜNCELLE
========================================== */

setInterval(
    updateNowPlaying,
    5000
);


/* ==========================================
   SES SEVİYESİ
========================================== */

radio.volume = 0.8;

</script>
